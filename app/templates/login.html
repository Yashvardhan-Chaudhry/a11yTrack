{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
  <h1>Sign in</h1>
  <p>Demo accounts only. Pick a user to continue.</p>
  <form method="post" action="{{ url_for('main.login') }}">
    <div class="field">
      <label for="user_id">Sign in as (required)</label>
      {% if error %}<p id="user_id-error" class="error">{{ error }}</p>{% endif %}
      <select id="user_id" name="user_id" {% if error %}aria-describedby="user_id-error" aria-invalid="true"{% endif %}>
        <option value="">Choose a user</option>
        {% for user in users %}
          <option value="{{ user.id }}">{{ user.display_name }}</option>
        {% endfor %}
      </select>
    </div>
    <button type="submit">Sign in</button>
  </form>
{% endblock %}
