{% extends "base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
  <h1>{{ heading }}</h1>
  <p>{{ message }}</p>
  {% if current_user %}
    <p><a href="{{ url_for('main.issues_list') }}">Back to your issues</a></p>
  {% else %}
    <p><a href="{{ url_for('main.login') }}">Go to sign in</a></p>
  {% endif %}
{% endblock %}
